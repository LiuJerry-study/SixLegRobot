;  六足机器人 ESP32  PlatformIO 工程配置
; ------------------------------------------------------------
;  用法（在 VS Code 打开本工作区）：
;    1. 已声明 PCA9685 舵机驱动依赖（lib_deps，首次会连 Adafruit BusIO 一起安装）
;    2. 插上 ESP32，左下角选好环境，点 Upload（或 pio run -t upload）
;    3. 想切换测试模式：改 build_flags 里的 MODE 宏（见 src/main.cpp 注释）
;
;  源码结构（PlatformIO 标准布局）：
;    src/  —— 全部源码：main.cpp（入口）+ Gait/LegKinematics/ServoManager/
;              SingleLeg/TripodGait 等类实现（.cpp）
;    include/ —— 全部头文件（.h），PlatformIO 自动加入头文件搜索路径
;  注：不再使用非标准的 scr/ 目录与 build_src_filter
;     （新版 PlatformIO/esp32 平台下自定义 src_filter 会令源文件列表为空）
;
;  依赖库：
;    adafruit/Adafruit PWM Servo Driver Library —— 通过 I2C 驱动 PCA9685，
;                                                （会自动连带安装 Adafruit BusIO）
;
;  引脚等硬件参数见 include/Config.h，PCA9685 接线见其中注释
; ============================================================

[platformio]
default_envs = esp32

; ---------------- 主环境：六足完整固件 ----------------
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; PCA9685 舵机驱动库
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^2.4.0

; 编译源码：默认编译 src/ 下全部 .cpp（main.cpp 入口 + 各模块实现）
; 在这里切换运行模式！ 对应 src/main.cpp 里的 #if defined(...)
build_flags =
    ; 可选模式（同时只能定义一个）：
    ;   SERVO_SWEEP / LEG_SWEEP / SINGLE_LEG_GRAB / TWO_LEGS / TWO_LEGS_CYCLE / TRIPOD
    ;   SERVO_TEST : 通用舵机测试（扫描/同步/串口控制），见 src/main.cpp 注释
    ;   SINGLE_SERVO_TEST : 平台单舵机测试（串口交互式，可测任意 1 路，见 test/SingleServoTest.cpp）
    ;   SINGLE_LEG_TEST   : 单腿测试（串口交互式，循环/定位/调参，见 test/SingleLegTest.cpp）
    ;   SIX_LEGS_SYNC     : 六腿同步测试（单腿动作扩展为 6 腿严格同步，见 test/SixLegsSyncTest.cpp）
    ;
    ; ★ PlatformIO 跑舵机测试：改成下面这行即可（并注释掉上一行）：
    ; -DMODE_SERVO_TEST
    ;
    -DMODE_SIX_LEGS_SYNC

; ---------------- （可选）直接编译某个 test 入口的环境 ----------------
; 用法：想单独烧 test/ 下的某测试文件时，暂时用它替换 src/main.cpp 后重新 Upload 即可。
; [env:tripod_test]
; platform = espressif32
; board = esp32dev
; framework = arduino
; monitor_speed = 115200
; lib_deps =
;     adafruit/Adafruit PWM Servo Driver Library@^2.4.0


