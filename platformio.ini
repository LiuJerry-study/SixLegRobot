;  六足机器人 ESP32  PlatformIO 工程配置
; ------------------------------------------------------------
;  用法（在 VS Code 打开本工作区）：
;    1. 已声明 PCA9685 舵机驱动依赖（lib_deps，首次会连 Adafruit BusIO 一起安装）
;    2. 插上 ESP32，左下角选好环境，点 Upload（或 pio run -t upload）
;    3. 想切换测试模式：改 build_flags 里的 MODE 宏（见 src/main.cpp 注释）
;
;  源码结构（PlatformIO 标准布局）：
;    src/  —— 全部源码：main.cpp（入口）+ Gait/LegKinematics/ServoManager/
;              SingleLeg/TripodGait 等类实现（.cpp）
;    include/ —— 全部头文件（.h），PlatformIO 自动加入头文件搜索路径
;    test/ —— 【不是 PlatformIO 单元测试目录】：里面的 .cpp 被 src/main.cpp 按
;              编译宏用 #include 引入（如 test/SingleLegTest.cpp ← -DMODE_SINGLE_LEG_TEST），
;              也可以单独在 Arduino IDE 里编译
;  注：不再使用非标准的 scr/ 目录与 build_src_filter
;     （新版 PlatformIO/esp32 平台下自定义 src_filter 会令源文件列表为空）
;
;  依赖库：
;    adafruit/Adafruit PWM Servo Driver Library —— 通过 I2C 驱动 PCA9685，
;                                                （会自动连带安装 Adafruit BusIO）
;
;  硬件：ESP32(esp32dev) + Arduino 框架；12 个舵机（6 腿 × 大腿 FEMUR / 小腿 TIBIA，
;        同一竖直平面内、无髋部旋转）由 PCA9685 驱动 —— I2C 地址 0x40、SDA=GPIO21、
;        SCL=GPIO22、50Hz，通道 ch = leg*2 + joint（ch0~ch11）
;  引脚等硬件参数见 include/Config.h，PCA9685 接线见其中注释
; ============================================================

[platformio]
default_envs = esp32

; ---------------- 主环境：六足完整固件 ----------------
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; PCA9685 舵机驱动库
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^2.4.0

; 编译源码：默认编译 src/ 下全部 .cpp（main.cpp 入口 + 各模块实现）
; 在这里切换运行模式！ 对应 src/main.cpp 里的 #if defined(...)
build_flags =
    ; 可选模式（build_flags 里写 -DMODE_ + 下列名字；同时只能定义一个）：
    ;   SERVO_SWEEP / LEG_SWEEP / SINGLE_LEG_GRAB / TWO_LEGS / TWO_LEGS_CYCLE / TRIPOD
    ;   SERVO_TEST : 通用舵机测试（扫描/同步/串口控制），见 src/main.cpp 注释
    ;   SINGLE_SERVO_TEST : 平台单舵机测试（串口交互式，可测任意 1 路，见 test/SingleServoTest.cpp）
    ;   SINGLE_LEG_TEST   : 可切换多腿测试（串口交互式：legs 运行时选 1~6 条腿，
    ;                       支持严格同步多腿/逐腿巡检/舵机直控，见 test/SingleLegTest.cpp）
    ;   SIX_LEGS_SYNC     : 六腿同步测试（单腿动作扩展为 6 腿严格同步，见 test/SixLegsSyncTest.cpp）
    ;   GAIT_6DIR         : 六方向步态测试（SingleLegTest 全部功能 + 三角步态 + 6 个行走方向，
    ;                       串口 help 看命令，见 test/Gait6DirTest.cpp）
    ;   MASTER_CONTROL    : 六足主控台（方向行走 + 选腿控制 + 单舵机控制，专门配合 gait-sim 网页
    ;                       悬空孪生 → 固件模式选「主控台」，见 test/MasterControl.cpp）
    ;
    ; ★ 切换模式：build_flags 里只保留一行未注释的 -DMODE_XXX（同时定义多个时，
    ;   src/main.cpp 的 #if/#elif 链按书写顺序取第一个命中的宏，容易误判）；
    ;   下面这行是通用舵机测试的样例，取消注释并注释掉当前生效的那一行即可：
    ; -DMODE_SERVO_TEST
    ;
    ; 当前生效：六足主控台（方向行走 / 选腿控制 / 单舵机控制；配 gait-sim 悬空孪生面板）
    -DMODE_MASTER_CONTROL
    ; 想回到六方向步态全功能测试就换成这一行（改名/删掉上面一行）：
    ; -DMODE_GAIT_6DIR
    ; 想回到纯可切换多腿测试就换成这一行（改名/删掉上面一行）：
    ; -DMODE_SINGLE_LEG_TEST

; ---------------- （可选）直接编译某个 test 入口的环境 ----------------
; 用法（早期做法，现在一般不需要）：把某个 test/*.cpp 的内容临时替换 src/main.cpp 再
;   Upload；正常做法是在上面的 build_flags 里选对应的 -DMODE_XXX（main.cpp 会 #include 该文件）。
; ⚠ 注意：下面这个样例环境没有 build_flags，直接启用会撞上 src/main.cpp 的
;   #error "未定义运行模式"，要另外补一行 -DMODE_XXX 才能编译。
; [env:tripod_test]
; platform = espressif32
; board = esp32dev
; framework = arduino
; monitor_speed = 115200
; lib_deps =
;     adafruit/Adafruit PWM Servo Driver Library@^2.4.0


